<html>
  <body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr><td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#1B3058;padding:24px;text-align:center;">
              <span style="color:#ffffff;font-size:22px;font-weight:800;letter-spacing:4px;">RIDE</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px;text-align:center;">
              <h2 style="margin:0 0 8px;color:#1B3058;font-size:19px;">Confirme seu email</h2>
              <p style="margin:0 0 24px;color:#4B5563;font-size:14px;line-height:1.5;">
                Use o código abaixo para confirmar seu cadastro no RideApp:
              </p>
              <div style="background:#f3f4f6;border-radius:10px;padding:18px;margin:0 0 24px;">
                <span style="color:#1B3058;font-size:32px;font-weight:800;letter-spacing:10px;">{{ .Token }}</span>
              </div>
              <p style="margin:0;color:#9CA3AF;font-size:12px;line-height:1.5;">
                O código expira em 1 hora. Se você não criou uma conta, ignore este email.
              </p>
            </td>
          </tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
