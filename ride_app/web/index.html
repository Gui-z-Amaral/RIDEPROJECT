<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rolês e viagens de moto com seus amigos e motoclubes.">
  <meta name="theme-color" content="#1B3058">
  <!--
    Viewport explícito permitindo ZOOM. O Flutter injeta um com
    `user-scalable=no`, o que impede quem enxerga mal de ampliar a tela — o
    Lighthouse sinaliza isso em acessibilidade.
    `viewport-fit=cover` faz o app usar a área do notch no iPhone.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    Open Graph — prévia do link no WhatsApp, Instagram, Facebook, Telegram.
    A imagem PRECISA de URL absoluta: os robôs não resolvem caminho relativo.
    O ?v= permite trocar a arte depois (essas prévias ficam muito cacheadas).
  -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RideApp">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="RideApp — Rolês e viagens de moto">
  <meta property="og:description" content="Planeje rolês e viagens, encontre riders próximos e acompanhe o trajeto em tempo real.">
  <meta property="og:url" content="https://app.ride.dev.br/">
  <meta property="og:image" content="https://app.ride.dev.br/og-image.png?v=1">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="RideApp — rolês e viagens de moto">

  <!-- Twitter/X usa o seu próprio conjunto de tags. -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="RideApp — Rolês e viagens de moto">
  <meta name="twitter:description" content="Planeje rolês e viagens, encontre riders próximos e acompanhe o trajeto em tempo real.">
  <meta name="twitter:image" content="https://app.ride.dev.br/og-image.png?v=1">

  <!-- iOS: PWA em tela cheia -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RideApp">
  <!-- 180px é o tamanho que o iOS usa na tela de início. -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">

  <!-- Favicon -->
  <!-- ?v= força navegador e CDN a buscarem de novo quando o ícone muda -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>RideApp</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Chave do Google Maps JS. O valor vem de web/env.js (git-ignored), assim a
    chave não vai pro repositório — mesma ideia do android/local.properties.
    O carregador injeta o script do Maps só se a chave existir.
  -->
  <script src="env.js"></script>
  <script>
    (function () {
      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.warn('GOOGLE_MAPS_API_KEY ausente — crie web/env.js. O mapa não vai carregar.');
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key;
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <!--
    Splash de carregamento. Feito em HTML (e não com apple-touch-startup-image)
    porque uma implementação só cobre iOS, Android e desktop — a alternativa
    seriam ~20 imagens, uma por tamanho de tela de iPhone.
    Some no evento `flutter-first-frame`, quando o app desenha a primeira tela.
  -->
  <style>
    #ride-splash{
      position:fixed; inset:0; z-index:10000;
      background:#1B3058;
      display:flex; align-items:center; justify-content:center;
      transition:opacity .35s ease;
    }
    #ride-splash img{width:132px;height:132px;animation:ride-pulse 1.6s ease-in-out infinite}
    #ride-splash.out{opacity:0; pointer-events:none}
    @keyframes ride-pulse{0%,100%{opacity:.75}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){#ride-splash img{animation:none}}
  </style>
  <div id="ride-splash">
    <img src="icons/logo-splash.png" alt="RideApp">
  </div>
  <script>
    (function () {
      var el = document.getElementById('ride-splash');
      var done = false;
      function hide() {
        if (done || !el) return;
        done = true;
        el.classList.add('out');
        setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 400);
      }
      // Flutter dispara este evento ao pintar o primeiro frame.
      window.addEventListener('flutter-first-frame', hide);
      // Rede de segurança: se algo falhar no carregamento, não deixa o usuário
      // preso numa tela azul para sempre.
      setTimeout(hide, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!--
    Convite para instalar o PWA. Vive aqui (e não no Dart) porque é uma
    preocupação exclusiva da web: o app nativo já está instalado. Assim o
    código Flutter não precisa de interop JS nem de conditional imports.

    - iOS: não existe prompt automático. Mostramos o passo a passo do
      "Adicionar à Tela de Início" (é também o único jeito de ter push no iOS).
    - Android/desktop: usamos o prompt nativo (beforeinstallprompt).
    - Já instalado (standalone) ou já dispensado: não aparece.
  -->
  <style>
    #ride-install{
      position:fixed; left:0; right:0; bottom:0; z-index:9999;
      background:#fff; color:#16202e;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      border-radius:18px 18px 0 0;
      box-shadow:0 -6px 32px rgba(20,32,46,.22);
      padding:20px 20px calc(20px + env(safe-area-inset-bottom));
      max-width:560px; margin:0 auto;
      transform:translateY(110%); transition:transform .32s ease;
    }
    #ride-install.show{transform:translateY(0)}
    #ride-install h3{margin:0 0 4px;font-size:17px;font-weight:800;color:#1B3058}
    #ride-install p.sub{margin:0 0 14px;font-size:13.5px;color:#5c6b80}
    #ride-install ol{margin:0 0 16px;padding-left:20px;font-size:14px;line-height:1.7}
    #ride-install ol b{color:#1B3058}
    #ride-install .row{display:flex;gap:10px}
    #ride-install button{
      flex:1;border:0;border-radius:10px;padding:12px;font-size:14px;
      font-weight:700;cursor:pointer;font-family:inherit;
    }
    #ride-install .primary{background:#1B3058;color:#fff}
    #ride-install .ghost{background:#eef1f6;color:#5c6b80}
    @media (prefers-color-scheme:dark){
      #ride-install{background:#16202f;color:#e7edf5}
      #ride-install h3{color:#8FA9D6}
      #ride-install p.sub{color:#95a3b8}
      #ride-install ol b{color:#8FA9D6}
      #ride-install .ghost{background:#26344a;color:#95a3b8}
    }
  </style>

  <div id="ride-install" role="dialog" aria-label="Instalar o RideApp" hidden>
    <h3 id="ride-install-title">Instale o RideApp</h3>
    <p class="sub" id="ride-install-sub"></p>
    <ol id="ride-install-steps" hidden>
      <li>Toque no botão <b>Compartilhar</b> (o quadrado com a seta pra cima).</li>
      <li>Escolha <b>“Adicionar à Tela de Início”</b>.</li>
      <li>Abra o RideApp pelo <b>ícone novo</b> — em tela cheia e com notificações.</li>
    </ol>
    <div class="row">
      <button class="primary" id="ride-install-go" hidden>Instalar app</button>
      <button class="ghost" id="ride-install-close">Agora não</button>
    </div>
  </div>

  <script>
  (function () {
    var KEY = 'ride-install-dismissed-v1';
    var el = document.getElementById('ride-install');
    var sub = document.getElementById('ride-install-sub');
    var steps = document.getElementById('ride-install-steps');
    var go = document.getElementById('ride-install-go');
    var close = document.getElementById('ride-install-close');
    var deferred = null;

    function dismissed() {
      try { return localStorage.getItem(KEY) === '1'; } catch (e) { return false; }
    }
    function remember() {
      try { localStorage.setItem(KEY, '1'); } catch (e) {}
    }
    function installed() {
      return window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    }
    function isIOS() {
      var ua = navigator.userAgent || '';
      // iPadOS 13+ se identifica como Macintosh — daí o teste de toque.
      return /iphone|ipad|ipod/i.test(ua) ||
        (/macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
    }
    function show() {
      if (dismissed() || installed()) return;
      el.hidden = false;
      // Espera o app pintar antes de subir a folha.
      setTimeout(function () { el.classList.add('show'); }, 50);
    }
    function hide() {
      el.classList.remove('show');
      setTimeout(function () { el.hidden = true; }, 320);
    }

    close.addEventListener('click', function () { remember(); hide(); });

    // Android / desktop: prompt nativo em um toque.
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferred = e;
      sub.textContent = 'Tenha o RideApp na tela inicial, em tela cheia.';
      go.hidden = false;
      steps.hidden = true;
      setTimeout(show, 2500);
    });

    go.addEventListener('click', function () {
      if (!deferred) return;
      hide();
      deferred.prompt();
      deferred.userChoice.then(function () { remember(); deferred = null; });
    });

    // iOS: sem prompt automático — ensinamos o caminho.
    if (isIOS() && !installed() && !dismissed()) {
      sub.textContent = 'No iPhone leva 3 toques — e é assim que as notificações passam a funcionar.';
      steps.hidden = false;
      go.hidden = true;
      setTimeout(show, 2500);
    }

    window.addEventListener('appinstalled', function () { remember(); hide(); });
  })();
  </script>
</body>
</html>
