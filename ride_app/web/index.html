<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Rolês e viagens de moto com seus amigos e motoclubes.">
  <meta name="theme-color" content="#1B3058">

  <!-- iOS: PWA em tela cheia -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RideApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>RideApp</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Chave do Google Maps JS. O valor vem de web/env.js (git-ignored), assim a
    chave não vai pro repositório — mesma ideia do android/local.properties.
    O carregador injeta o script do Maps só se a chave existir.
  -->
  <script src="env.js"></script>
  <script>
    (function () {
      var key = window.GOOGLE_MAPS_API_KEY;
      if (!key) {
        console.warn('GOOGLE_MAPS_API_KEY ausente — crie web/env.js. O mapa não vai carregar.');
        return;
      }
      var s = document.createElement('script');
      s.src = 'https://maps.googleapis.com/maps/api/js?key=' + key;
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
