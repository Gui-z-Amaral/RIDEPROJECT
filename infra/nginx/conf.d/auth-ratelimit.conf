# Limite de tentativas nos endpoints de autenticacao.
#
# Feito aqui e nao na Cloudflare porque filtrar por query string (para separar
# login de renovacao de sessao) exige o plano Advanced Rate Limiting.
#
# IMPORTANTE: /auth/v1/token faz DUAS coisas — entrar com senha e renovar a
# sessao de quem ja esta usando o app. Limitar o caminho inteiro derrubaria a
# renovacao, e o sintoma seria "o app desloga sozinho". O map abaixo devolve uma
# chave vazia para tudo que nao for login com senha, e o limit_req IGNORA
# requisicao de chave vazia — ou seja, renovacao passa livre.
#
# $binary_remote_addr e o IP REAL do usuario, nao o da Cloudflare, gracas ao
# set_real_ip_from em cloudflare-realip.conf. Sem aquilo, o limite contaria
# todos os usuarios como um so.
map $arg_grant_type $auth_login_key {
    default   "";
    password  $binary_remote_addr;
}

# Login com senha: mais folgado, porque erro de digitacao e comum e operadoras
# de celular no Brasil colocam muita gente atras do mesmo IP (CGNAT).
limit_req_zone $auth_login_key     zone=auth_login:10m rate=20r/m;

# Cadastro, recuperacao e conferencia de codigo. O /verify e /otp checam codigos
# de 6 digitos: sem limite, da para varrer todas as combinacoes.
limit_req_zone $binary_remote_addr zone=auth_codes:10m rate=10r/m;

limit_req_status 429;
